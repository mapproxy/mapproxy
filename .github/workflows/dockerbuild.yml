name: Docker Build and Publish

permissions:
  packages: write
  security-events: write

on:
  push:
    tags:
      - "*.*.*"
  # Manual rebuild of a release. The release tag is checked out, so the images only change in their dependencies.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, e.g. 8.0.0 (default: latest release)"
        required: false

jobs:
  get-version:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ghcr.io/${{ github.repository }}/mapproxy:${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$TAG'"
            exit 1
          fi
          echo "Using release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-and-publish-ubuntu:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.get-version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            MAPPROXY_VERSION=${{ needs.get-version.outputs.tag }}
          push: true
          target: base
          tags: ${{ needs.get-version.outputs.version }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            MAPPROXY_VERSION=${{ needs.get-version.outputs.tag }}
          push: true
          target: development
          tags: ${{ needs.get-version.outputs.version }}-dev
          platforms: linux/amd64,linux/arm64

      - name: Build and push nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            MAPPROXY_VERSION=${{ needs.get-version.outputs.tag }}
          push: true
          target: nginx
          tags: ${{ needs.get-version.outputs.version }}-nginx
          platforms: linux/amd64,linux/arm64

  build-and-publish-alpine:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.get-version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile-alpine
          build-args: |
            MAPPROXY_VERSION=${{ needs.get-version.outputs.tag }}
          push: true
          target: base
          tags: ${{ needs.get-version.outputs.version }}-alpine
          platforms: linux/amd64,linux/arm64

      - name: Build and push alpine development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile-alpine
          build-args: |
            MAPPROXY_VERSION=${{ needs.get-version.outputs.tag }}
          push: true
          target: development
          tags: ${{ needs.get-version.outputs.version }}-alpine-dev
          platforms: linux/amd64,linux/arm64

      - name: Build and push alpine based nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile-alpine
          build-args: |
            MAPPROXY_VERSION=${{ needs.get-version.outputs.tag }}
          push: true
          target: nginx
          tags: ${{ needs.get-version.outputs.version }}-alpine-nginx
          platforms: linux/amd64,linux/arm64

  run-trivy:
    needs:
      - get-version
      - build-and-publish-ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Run trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: 'sarif'
          ignore-unfixed: true
          image-ref: ${{ needs.get-version.outputs.version }}
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'
