name: Running mapproxy tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read  #  to fetch code (actions/checkout)
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      redis-server:
        image: redis@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
      couchdb:
        image: couchdb:2@sha256:30dc067ce470fd437f4074d41f150fa81c1ff9c923a371d38f155d1a36159f4e
        ports:
          - 5984:5984
      azure-blob:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports:
          - 10000:10000

    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
        pillow-version: ["13.0.0"]

    env:
      MAPPROXY_TEST_COUCHDB: 'http://localhost:5984'
      MAPPROXY_TEST_REDIS: '127.0.0.1:6379'
      MAPPROXY_TEST_AZURE_BLOB: 'http://localhost:10000'
      # do not load /etc/boto.cfg with Python 3 incompatible plugin
      # https://github.com/travis-ci/travis-ci/issues/5246#issuecomment-166460882
      BOTO_CONFIG: '/doesnotexist'

    steps:
    - name: Install packages
      run: |
        sudo apt update
        sudo apt install proj-bin libgeos-dev libgdal-dev libxslt-dev libxml2-dev build-essential libjpeg-dev zlib1g-dev libfreetype6-dev protobuf-compiler libprotoc-dev -y

    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Use python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies ⏬
      run: |
        pip install .
        pip install -r requirements-tests.txt
        pip install Pillow==${{ matrix.pillow-version }}
        pip freeze

    - name: Run tests 🏗️
      run: |
        export LD_PRELOAD=/lib/x86_64-linux-gnu/libstdc++.so.6:$LD_PRELOAD
        pytest mapproxy

  coverage:
    runs-on: ubuntu-24.04
    services:
      redis-server:
        image: redis@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
        ports:
          - 6379:6379
      couchdb:
        image: couchdb:2@sha256:30dc067ce470fd437f4074d41f150fa81c1ff9c923a371d38f155d1a36159f4e
        ports:
          - 5984:5984
      azure-blob:
        image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports:
          - 10000:10000

    env:
      MAPPROXY_TEST_COUCHDB: 'http://localhost:5984'
      MAPPROXY_TEST_REDIS: '127.0.0.1:6379'
      MAPPROXY_TEST_AZURE_BLOB: 'http://localhost:10000'
      # do not load /etc/boto.cfg with Python 3 incompatible plugin
      # https://github.com/travis-ci/travis-ci/issues/5246#issuecomment-166460882
      BOTO_CONFIG: '/doesnotexist'

    steps:
      - name: Install packages
        run: |
          sudo apt update
          sudo apt install proj-bin libgeos-dev libgdal-dev libxslt-dev libxml2-dev build-essential libjpeg-dev zlib1g-dev libfreetype6-dev protobuf-compiler libprotoc-dev -y

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies ⏬
        run: |
          pip install .
          pip install -r requirements-tests.txt
          pip freeze

      - name: Run tests with coverage 🏗️
        run: |
          export LD_PRELOAD=/lib/x86_64-linux-gnu/libstdc++.so.6:$LD_PRELOAD
          coverage run -m pytest mapproxy

      - name: Create coverage report
        run: |
          coverage report -m --format markdown > coverage-report.md
          echo "${{ github.event.number }}" > pr_number.txt

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request'
        with:
          name: coverage-report
          path: |
            coverage-report.md
            pr_number.txt

  doc:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install doc dependencies ⏬
      run: pip install sphinx sphinx-book-theme sphinx-copybutton

    - name: Run documentation build
      run: sphinx-build doc/ docs -W

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14

      - name: Install requirements
        run: |
          pip install -r requirements-tests.txt

      - name: flake8 Lint
        run: |
          flake8

  typechecking:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14

      - name: Install requirements
        run: |
          pip install -r requirements-tests.txt

      - name: mypy Static Typechecking
        run: |
          mypy mapproxy
