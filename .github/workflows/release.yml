name: Release
on:
  push:
    tags:
      - "*.*.*"

jobs:
  build-publish-release:
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/MapProxy
    permissions:
      id-token: write  # this permission is needed for trusted publishing on pypi
      contents: write # this is needed to create the github release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Make wheel
        run: |
          pip install -q build
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

      - name: Grep changes
        run: |
          awk '
          /^[0-9]+\.[0-9]+\.[0-9]+ [0-9]{4}-[0-9]{2}-[0-9]{2}$/ { if (header_found) exit; header_found=1; skip=2}
          skip { skip--; next }
          /^.*$/ { print }
          ' CHANGES.txt > RELEASE_NOTES.txt

      - name: Create a GitHub release page
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          generateReleaseNotes: true
          bodyFile: RELEASE_NOTES.txt
          artifacts: "dist/*.whl"
